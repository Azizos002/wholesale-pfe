<section class="auth-shell">
  <aside class="auth-media"><div class="overlay"><h2>Premium Groceries, Delivered with Precision.</h2></div></aside>
  <div class="auth-form-wrap">
    <form class="auth-form" (ngSubmit)="login()">
      <h1>Welcome back</h1>
      <label class="floating"><input [(ngModel)]="email" name="email" type="email" placeholder=" " required><span>Email</span></label>
      <label class="floating"><input [(ngModel)]="password" name="password" type="password" placeholder=" " required><span>Password</span></label>
      <button #submitBtn type="submit" (mousemove)="onBtnMove($event)" (mouseleave)="resetBtn()" class="primary-btn">Sign in</button>
      <p>Need an account? <a routerLink="/register">Register</a></p>
    </form>
  </div>
</section>
