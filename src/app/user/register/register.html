<section class="auth-shell">
  <aside class="auth-media"><div class="overlay"><h2>Wholesale Ingredients for Culinary Excellence.</h2></div></aside>
  <div class="auth-form-wrap">
    <form class="auth-form" (ngSubmit)="register()">
      <h1>Create account</h1>
      <label class="floating"><input [(ngModel)]="fullName" name="fullName" type="text" placeholder=" " required><span>Full name</span></label>
      <label class="floating"><input [(ngModel)]="email" name="email" type="email" placeholder=" " required><span>Email</span></label>
      <label class="floating"><input [(ngModel)]="password" name="password" type="password" placeholder=" " required><span>Password</span></label>
      <button #submitBtn type="submit" (mousemove)="onBtnMove($event)" (mouseleave)="resetBtn()" class="primary-btn">Create account</button>
      <p>Already a member? <a routerLink="/login">Sign in</a></p>
    </form>
  </div>
</section>
