<div class="relative min-h-screen overflow-x-hidden bg-gradient-to-b from-slate-50 to-wheat/10 text-slate-900 dark:from-slate-950 dark:to-slate-900 dark:text-slate-50">
  <app-custom-cursor />

  <div class="ambient-bg pointer-events-none absolute inset-0 -z-10">
    <div class="orb orb-wheat"></div>
    <div class="orb orb-olive"></div>
    <div class="orb orb-mist"></div>
  </div>

  <div #smoothContent class="smooth-content fixed inset-0 overflow-hidden will-change-transform">
    <app-navbar />

    <main class="relative z-10 mx-auto w-full max-w-7xl space-y-14 overflow-x-hidden px-4 pb-20 pt-8 md:px-8">
      <div [@routeAnimations]="prepareRoute(outlet)">
        <router-outlet #outlet="outlet" />
      </div>
    </main>

    <app-footer />
  </div>
</div>
